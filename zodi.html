<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zodiak Harian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .zodiac-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            min-height: 250px;
        }
        
        .zodiac-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .zodiac-title {
            font-family: 'Playfair Display', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 10px;
        }
        
        .zodiac-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
        }
        
        .last-update {
            background: linear-gradient(45deg, #ff6b6b, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        
        .constellation {
            position: fixed;
            opacity: 0.1;
            pointer-events: none;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="loading-screen">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;"></div>
    </div>

    <div class="container py-5">
        <h1 class="text-center mb-4">Ramalan Zodiak Harian</h1>
        <div class="text-center mb-4 last-update" id="date"></div>
        
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="zodiacGrid"></div>
    </div>

    <script>
        const zodiacSigns = [
            'aries', 'taurus', 'gemini', 'cancer', 
            'leo', 'virgo', 'libra', 'scorpio', 
            'sagitarius', 'capricorn', 'aquarius', 'pisces'
        ];

        const zodiacIcons = {
            aries: '♈', taurus: '♉', gemini: '♊', cancer: '♋',
            leo: '♌', virgo: '♍', libra: '♎', scorpio: '♏',
            sagitarius: '♐', capricorn: '♑', aquarius: '♒', pisces: '♓'
        };

        async function fetchZodiac() {
            try {
                document.querySelector('.loading-screen').style.display = 'flex';
                
                const response = await fetch('https://script.google.com/macros/s/AKfycbywRYYUjvLXuKA0Ad2CUJta3lRDA6RTtHMzWMmFY9jaPzqa9WdWgO9iROHQxi_L9qqK/exec');
                const data = await response.json();
                
                if(data.status === 'success') {
                    document.getElementById('date').textContent = `Update Terakhir: ${data.date}`;
                    renderZodiac(data);
                }
            } catch(error) {
                alert('Gagal memuat data zodiak: ' + error.message);
            } finally {
                document.querySelector('.loading-screen').style.display = 'none';
            }
        }

        function renderZodiac(data) {
            const grid = document.getElementById('zodiacGrid');
            grid.innerHTML = '';
            
            zodiacSigns.forEach(sign => {
                const card = document.createElement('div');
                card.className = 'col';
                card.innerHTML = `
                    <div class="zodiac-card p-4 h-100">
                        <div class="d-flex align-items-center mb-3">
                            <div class="display-4 me-3">${zodiacIcons[sign]}</div>
                            <h3 class="zodiac-title mb-0">${sign.charAt(0).toUpperCase() + sign.slice(1)}</h3>
                        </div>
                        <p class="mb-0" style="line-height: 1.6">${data[sign]}</p>
                    </div>
                `;
                
                // Add random rotation effect
                card.style.transform = `rotate(${Math.random() * 4 - 2}deg)`;
                grid.appendChild(card);
            });
        }

        // Initial load
        fetchZodiac();
    </script>
</body>
</html>
