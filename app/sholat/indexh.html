<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Sholat & Cuaca</title>
  <link rel="manifest" href="../../manifest.json">
  <link href="../../asset/css/all.min.css" rel="stylesheet">
  <link href="../../asset/css/select2.min.css" rel="stylesheet">
  <style>
    /* Reset dasar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.5rem;
      letter-spacing: 1px;
    }
    .btn {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      color: #fff;
    }
    .btn:hover {
      background: rgba(255,255,255,0.4);
    }
    .select-custom {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      margin-bottom: 20px;
      outline: none;
    }
    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
      margin-bottom: 30px;
    }
    .glass-card h2 {
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    .weather-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .weather-section .details {
      font-size: 1.2rem;
    }
    .countdown {
      margin-top: 15px;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    /* Jadwal Sholat */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .schedule-item {
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      backdrop-filter: blur(5px);
    }
    .schedule-item i {
      font-size: 1.5rem;
      margin-bottom: 5px;
      display: block;
    }
    .error-message {
      text-align: center;
      color: #ff6b6b;
      margin-top: 20px;
    }
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }
    }
  </style>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../../service-worker.js")
          .then(reg => console.log("Service worker registered.", reg))
          .catch(err => console.log("Service worker registration failed:", err));
      });
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <button id="notificationToggle" class="btn">
        <i class="fas fa-bell"></i>
      </button>
      <h1><i class="fas fa-mosque"></i> Jadwal Sholat & Cuaca</h1>
      <button id="darkModeToggle" class="btn">
        <i class="fas fa-moon"></i>
      </button>
    </header>
    <select id="select-kota" class="select-custom">
      <option value="">- Pilih Kota -</option>
    </select>
    <button id="getSchedule" class="btn" style="width:100%; margin-bottom:20px; background: rgba(255,255,255,0.3);">
      <i class="fas fa-calendar-alt"></i> Tampilkan Jadwal
    </button>
    <!-- Weather Card -->
    <div class="glass-card" id="weatherCard">
      <div class="weather-section">
        <div class="details">
          <h2 id="location"></h2>
          <p id="full-date"></p>
        </div>
        <div id="weather-icon" style="font-size: 3rem;"></div>
      </div>
      <div class="countdown" id="countdown"></div>
    </div>
    <!-- Schedule Card -->
    <div class="glass-card" id="scheduleCard" style="display:none;">
      <div class="schedule-grid">
        <div class="schedule-item">
          <i class="fas fa-moon" style="color: #4fc3f7;"></i>
          <p>Imsak</p>
          <p id="imsak"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-pray" style="color: #81c784;"></i>
          <p>Subuh</p>
          <p id="subuh"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-cloud-sun" style="color: #ffb74d;"></i>
          <p>Terbit</p>
          <p id="terbit"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-sun" style="color: #fdd835;"></i>
          <p>Dhuha</p>
          <p id="dhuha"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-sun" style="color: #ffe082;"></i>
          <p>Dzuhur</p>
          <p id="dzuhur"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-cloud-sun" style="color: #ffcc80;"></i>
          <p>Ashar</p>
          <p id="ashar"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-cloud-moon" style="color: #e57373;"></i>
          <p>Maghrib</p>
          <p id="maghrib"></p>
        </div>
        <div class="schedule-item">
          <i class="fas fa-moon" style="color: #9575cd;"></i>
          <p>Isya</p>
          <p id="isya"></p>
        </div>
      </div>
    </div>
    <div id="errorMsg" class="error-message"></div>
  </div>
  
  <script src="../../asset/js/jquery-3.6.0.min.js"></script>
  <script src="../../asset/js/select2.min.js"></script>
  <script src="../../asset/js/sholat3.js"></script>
</body>
</html>
