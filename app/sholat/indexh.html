<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Sholat & Cuaca</title>
  <meta name="theme-color" content="#1f2937">
  <link rel="icon" href="../../asset/icon/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="../../asset/icon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../asset/icon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../asset/icon/favicon-16x16.png">
  <link rel="manifest" href="../../manifest.json">
  <link href="../../asset/css/all.min.css" rel="stylesheet">
  <link href="../../asset/css/select2.min.css" rel="stylesheet" />
  <link href="../../asset/css/sholat.css" rel="stylesheet" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("../../service-worker.js")
          .then((reg) => console.log("Service worker registered.", reg))
          .catch((err) => console.log("Service worker registration failed:", err));
      });
    }
  </script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-300 dark:from-gray-800 dark:to-gray-900">
  <!-- Header -->
  <header class="bg-white dark:bg-gray-900 shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <button id="notificationToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
          <i class="fas fa-bell"></i>
        </button>
        <h1 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-white">
          <i class="fas fa-mosque mr-2"></i>Jadwal Sholat & Cuaca
        </h1>
      </div>
      <button id="darkModeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
        <i class="fas fa-moon dark:hidden"></i>
        <i class="fas fa-sun hidden dark:inline"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    <!-- Kota Selector -->
    <div class="mb-6">
      <select id="select-kota" class="w-full p-3 rounded-lg border border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-600">
        <option value="">- Pilih Kota -</option>
      </select>
    </div>
    <!-- Tampilkan Jadwal Button -->
    <div class="mb-6">
      <button id="getSchedule" class="w-full py-3 rounded-full bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold shadow-md transform transition hover:scale-105">
        <i class="fas fa-calendar-alt mr-2"></i> Tampilkan Jadwal
      </button>
    </div>

    <!-- Cards Section -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Weather Card -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <h2 id="location" class="text-2xl font-semibold text-gray-900 dark:text-white"></h2>
          <div id="weather-icon" class="text-3xl"></div>
        </div>
        <div class="mt-4">
          <p id="full-date" class="text-gray-600 dark:text-gray-300"></p>
          <p id="countdown" class="mt-2 text-lg font-bold text-primary-600 dark:text-primary-400"></p>
        </div>
      </div>
      <!-- Jadwal Sholat Card -->
      <div id="schedule" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 hidden">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-moon text-blue-400 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Imsak</p>
              <p id="imsak" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-pray text-blue-500 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Subuh</p>
              <p id="subuh" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-cloud-sun text-orange-400 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Terbit</p>
              <p id="terbit" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-sun text-yellow-600 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Dhuha</p>
              <p id="dhuha" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-sun text-yellow-400 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Dzuhur</p>
              <p id="dzuhur" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-cloud-sun text-orange-500 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Ashar</p>
              <p id="ashar" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-cloud-moon text-red-500 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Maghrib</p>
              <p id="maghrib" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
          <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg flex items-center space-x-3">
            <i class="fas fa-moon text-indigo-500 text-xl"></i>
            <div>
              <p class="text-sm text-gray-700 dark:text-gray-300">Isya</p>
              <p id="isya" class="font-semibold text-gray-900 dark:text-white"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="mt-4 text-red-500 text-center hidden"></div>
  </main>

  <script src="../../asset/js/jquery-3.6.0.min.js"></script>
  <script src="../../asset/js/select2.min.js"></script>
  <script src="../../asset/js/sholat2.js"></script>
</body>
</html>
