<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8">
    <title>Jadwal Sholat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <link rel="icon" href="../../asset/icon/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="../../asset/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../asset/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../asset/icon/favicon-16x16.png">
    <link rel="manifest" href="../../manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("../../service-worker.js")

            });

    <link href="../../asset/css/all.min.css" rel="stylesheet">
    <link href="../../asset/css/select2.min.css" rel="stylesheet" />
    <style>
        /* Base Styles */
        :root {
            --primary-color: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary-color: #6366f1;
            --accent-color: #8b5cf6;
            --dark-bg: #111827;
            --dark-card: #1f2937;
            --dark-card-hover: #374151;
            --light-bg: #f9fafb;
            --light-card: #ffffff;
            --light-card-hover: #f3f4f6;
            --text-dark: #1f2937;
            --text-light: #f9fafb;
            --text-muted-dark: #6b7280;
            --text-muted-light: #e5e7eb;
            --border-radius: 1rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            transition: var(--transition);
        }

        body.dark {
            background-color: var(--dark-bg);
            color: var(--text-light);
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo i {
            margin-right: 0.5rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background-color: var(--light-card);
            color: var(--text-dark);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .dark .btn-icon {
            background-color: var(--dark-card);
            color: var(--text-light);
        }

        .btn-icon:hover {
            background-color: var(--primary-light);
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .dark .btn-icon:hover {
            background-color: var(--primary-dark);
        }

        /* Location Selector */
        .location-selector {
            position: relative;
            margin-bottom: 2rem;
        }

        .select-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .select-wrapper select {
            width: 100%;
            padding: 1rem;
            border-radius: var(--border-radius);
            border: 2px solid var(--text-muted-dark);
            background-color: var(--light-card);
            color: var(--text-dark);
            font-size: 1rem;
            appearance: none;
            transition: var(--transition);
        }

        .dark .select-wrapper select {
            background-color: var(--dark-card);
            color: var(--text-light);
            border-color: var(--dark-card-hover);
        }

        .select-wrapper select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .select-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted-dark);
        }

        .dark .select-icon {
            color: var(--text-muted-light);
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent-color) 100%);
        }

        .btn-primary i {
            margin-right: 0.5rem;
        }

        /* Info Cards */
        .info-card {
            background-color: var(--light-card);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            overflow: hidden;
            position: relative;
        }

        .dark .info-card {
            background-color: var(--dark-card);
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .location-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .location-name {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .weather-icon {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .date-info {
            color: var(--text-muted-dark);
            margin-bottom: 1rem;
        }

        .dark .date-info {
            color: var(--text-muted-light);
        }

        .countdown {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
        }

        .countdown i {
            margin-right: 0.5rem;
        }

        /* Prayer Times Grid */
        .prayer-times-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .prayer-card {
            background-color: var(--light-card);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .dark .prayer-card {
            background-color: var(--dark-card);
        }

        .prayer-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            background-color: var(--light-card-hover);
        }

        .dark .prayer-card:hover {
            background-color: var(--dark-card-hover);
        }

        .prayer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .prayer-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .prayer-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .dark .prayer-name {
            color: var(--text-light);
        }

        .prayer-time {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Active Prayer Highlight */
        .prayer-card.active {
            border: 2px solid var(--primary-color);
            background-color: var(--primary-light);
        }

        .dark .prayer-card.active {
            background-color: rgba(16, 185, 129, 0.2);
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .prayer-times-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .prayer-times-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Error Message */
        .error-message {
            background-color: #fee2e2;
            color: #ef4444;
            padding: 1rem;
            border-radius: var(--border-radius);
            text-align: center;
            margin-top: 1rem;
            font-weight: 600;
        }

        .dark .error-message {
            background-color: #7f1d1d;
            color: #fecaca;
        }

        /* Animation */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* Tooltip Styles */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: var(--dark-bg);
            color: var(--text-light);
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
        }

        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--dark-bg) transparent transparent transparent;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* Loading Spinner */
        .loading {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Fancy Select */
        .select2-container {
            width: 100% !important;
        }

        .select2-container--default .select2-selection--single {
            border-radius: var(--border-radius);
            height: 3.25rem;
            display: flex;
            align-items: center;
            border: 2px solid var(--text-muted-dark);
            background-color: var(--light-card);
            transition: var(--transition);
        }

        .dark .select2-container--default .select2-selection--single {
            background-color: var(--dark-card);
            border-color: var(--dark-card-hover);
        }

        .select2-container--default .select2-selection--single:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-dark);
            line-height: normal;
            padding-left: 1rem;
            font-size: 1rem;
        }

        .dark .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-light);
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 100%;
            right: 1rem;
        }

        .select2-dropdown {
            border-radius: var(--border-radius);
            border: 2px solid var(--primary-color);
            background-color: var(--light-card);
            box-shadow: var(--shadow-lg);
        }

        .dark .select2-dropdown {
            background-color: var(--dark-card);
        }

        .select2-container--default .select2-search--dropdown .select2-search__field {
            border: 1px solid var(--text-muted-dark);
            border-radius: 0.5rem;
            padding: 0.5rem;
            background-color: var(--light-card);
            color: var(--text-dark);
        }

        .dark .select2-container--default .select2-search--dropdown .select2-search__field {
            background-color: var(--dark-card);
            color: var(--text-light);
        }

        .select2-container--default .select2-results__option {
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: var(--primary-color);
            color: white;
        }

        /* Add some fancy elements */
        .curved-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 0 0 50% 50% / 0 0 100px 100px;
            z-index: -1;
        }

        .dark .curved-background {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent-color) 100%);
        }

        .app-wrapper {
            position: relative;
            padding-top: 2rem;
        }

        /* Next prayer badge */
        .next-prayer-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            z-index: 1;
        }

        /* Next prayer time indicators */
        @keyframes blink {
            0% {opacity: 1;}
            50% {opacity: 0.5;}
            100% {opacity: 1;}
        }

        .next-prayer {
            position: relative;
        }

        .next-prayer::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--primary-color);
            border-radius: 50%;
            top: 10px;
            right: 10px;
            animation: blink 1.5s infinite;
        }
    </style>
</head>

    <script src="../../asset/js/jquery-3.6.0.min.js"></script>
    <script src="../../asset/js/select2.min.js"></script>
    <script src="../../asset/js/sholat2.js"></script>
    <script>
        // Initialize Select2
        $(document).ready(function() {
            $('#select-kota').select2({
                placeholder: "Pilih Kota",
                allowClear: true
            });

            // Dark mode toggle
            $('#darkModeToggle').on('click', function() {
                $('body').toggleClass('dark');
                $('.fa-moon, .fa-sun').toggleClass('hidden');
                
                // Save preference to localStorage
                if ($('body').hasClass('dark')) {
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    localStorage.setItem('darkMode', 'disabled');
                }
            });

            // Check for saved dark mode preference
            if (localStorage.getItem('darkMode') === 'enabled') {
                $('body').addClass('dark');
                $('.fa-moon').addClass('hidden');
                $('.fa-sun').removeClass('hidden');
            } else if (localStorage.getItem('darkMode') === 'disabled') {
                $('body').removeClass('dark');
                $('.fa-sun').addClass('hidden');
                $('.fa-moon').removeClass('hidden');
            }

            // Notification toggle
            $('#notificationToggle').on('click', function() {
                // Request notification permission
                if ("Notification" in window) {
                    Notification.requestPermission().then(function(permission) {
                        if (permission === "granted") {
                            alert("Notifikasi waktu sholat diaktifkan!");
                        }
                    });
                }
            });

            // Highlight active prayer time (just a demo)
            function highlightActivePrayer() {
                // In actual implementation, this would check current time against prayer times
                // For demo purposes, we're just highlighting a fixed element
                $('.prayer-card').removeClass('active');
                $('.prayer-card:nth-child(5)').addClass('active next-prayer');
            }
            
            highlightActivePrayer();
        });
    </script>
</body>
