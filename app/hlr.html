<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLR Lookup Indonesia</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .input-group {
            max-width: 500px;
            margin: 0 auto;
        }
        .result-title {
            color: #2c3e50;
            font-weight: 600;
        }
        .provider-badge {
            background: #2c3e50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4 text-white">Cek Info Nomor HP Indonesia</h1>
        
        <div class="input-group mb-4">
            <input type="text" 
                   class="form-control" 
                   placeholder="Masukkan nomor HP (contoh: 0852xxxxxxx)" 
                   id="phoneNumber"
                   maxlength="13">
            <button class="btn btn-primary" onclick="checkHLR()">
                Cek Sekarang
            </button>
        </div>

        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="result" class="row row-cols-1 row-cols-md-2 g-4 d-none">
            <!-- Hasil akan ditampilkan di sini -->
        </div>
    </div>

    <script>
        async function checkHLR() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');

            if (!phoneNumber) {
                alert('Silahkan masukkan nomor telepon terlebih dahulu');
                return;
            }

            try {
                loading.classList.remove('d-none');
                resultDiv.classList.add('d-none');

                const response = await fetch(`https://script.google.com/macros/s/AKfycbwx_d7KPLH1x2AjCf8yfAAvOCueZZxteegaormYL3i9xf2ejkMwodJVHPB0OZeEZ_Pc_A/exec?no=${phoneNumber}`);
                const data = await response.json();

                if (data.status === 'success') {
                    resultDiv.innerHTML = `
                        <div class="col">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title result-title">Informasi Nomor</h5>
                                    <ul class="list-group list-group-flush">
                                        <li class="list-group-item d-flex justify-content-between">
                                            <span>Nomor:</span>
                                            <span>${data.number}</span>
                                        </li>
                                        <li class="list-group-item d-flex justify-content-between">
                                            <span>Kode Negara:</span>
                                            <span>+${data.number_code}</span>
                                        </li>
                                        <li class="list-group-item d-flex justify-content-between">
                                            <span>Tipe:</span>
                                            <span class="text-capitalize">${data.type}</span>
                                        </li>
                                        <li class="list-group-item d-flex justify-content-between">
                                            <span>Zona Waktu:</span>
                                            <span>${data.timezone}</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="col">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title result-title">Lokasi & Provider</h5>
                                    <ul class="list-group list-group-flush">
                                        <li class="list-group-item">
                                            <div class="fw-bold">Negara:</div>
                                            ${data.country} (${data.country_code})
                                        </li>
                                        <li class="list-group-item">
                                            <div class="fw-bold">Kota:</div>
                                            ${data.city}
                                        </li>
                                        <li class="list-group-item">
                                            <div class="fw-bold">Operator:</div>
                                            <span class="provider-badge">${data.provider}</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                    resultDiv.classList.remove('d-none');
                } else {
                    throw new Error('Data tidak ditemukan');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                loading.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
