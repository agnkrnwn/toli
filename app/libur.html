<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Libur Nasional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a8a5e6;
        }
        
        body {
            background: linear-gradient(45deg, #0f0c29, #302b63);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
        }
        
        .timeline {
            position: relative;
            padding: 50px 0;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            transform: translateX(-50%);
        }
        
        .timeline-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }
        
        .timeline-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
        }
        
        .timeline-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }
        
        .month-header {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .holiday-badge {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .year-input {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary);
            color: #fff;
            font-weight: bold;
            text-align: center;
        }
        
        .year-input:focus {
            box-shadow: 0 0 15px var(--primary);
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.05);
        }
        
        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 mb-3">📅 Kalender Libur Nasional</h1>
            <input type="number" 
                   class="year-input rounded-pill px-4 py-2" 
                   value="2025"
                   min="2020"
                   max="2030"
                   id="yearInput">
        </div>
        
        <div class="timeline">
            <div id="timelineContent" class="position-relative"></div>
        </div>
    </div>

    <script>
        const monthsOrder = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        
        async function loadHolidays(year) {
            try {
                const response = await fetch(`https://script.google.com/macros/s/AKfycbxTj7WY21RLM8RO6biCeobN5BGAzRUgvfzGxvGJ-Scww6rsgXZWIbK0WSpMjhac5vxs/exec?tahun=${year}`);
                const data = await response.json();
                
                if(data.status === 'success') {
                    renderTimeline(data.data);
                }
            } catch(error) {
                alert('Gagal memuat data: ' + error.message);
            }
        }

        function renderTimeline(holidays) {
            const timeline = document.getElementById('timelineContent');
            timeline.innerHTML = '';
            
            // Group by month
            const grouped = holidays.reduce((acc, curr) => {
                if(!acc[curr.bulan]) acc[curr.bulan] = [];
                acc[curr.bulan].push(curr);
                return acc;
            }, {});
            
            // Sort months according to order
            const sortedMonths = monthsOrder.map(m => ({
                month: m,
                holidays: grouped[m] || []
            }));
            
            // Generate HTML
            sortedMonths.forEach((monthData, index) => {
                const sideClass = index % 2 === 0 ? 'timeline-left' : 'timeline-right';
                const monthHTML = `
                    <div class="row mb-4 ${sideClass}">
                        <div class="col-md-6 ${index % 2 === 0 ? 'offset-md-6' : ''}">
                            <div class="timeline-card p-4 mb-3">
                                <h3 class="month-header mb-4">${monthData.month}</h3>
                                <div class="holiday-list">
                                    ${monthData.holidays.map(holiday => `
                                        <div class="holiday-badge mb-3">
                                            <div class="d-flex align-items-center">
                                                <div class="fw-bold me-3">${holiday.tanggal}</div>
                                                <div>${holiday.title}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                timeline.innerHTML += monthHTML;
            });
        }

        // Event listeners
        document.getElementById('yearInput').addEventListener('change', function(e) {
            loadHolidays(e.target.value);
        });

        // Initial load
        loadHolidays(2025);
    </script>
</body>
</html>
